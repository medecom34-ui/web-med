<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />

  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/catmobile.css" media="(max-width: 768px)">
<style>

    .ss{position:relative;width:100%;font-size:16px}
    .ss-trigger{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #e5e7eb;cursor:pointer}
    .ss-trigger:focus{outline:2px solid #bfdcff}
    .ss-icon{flex:0 0 32px;width:32px;height:32px;aspect-ratio:1/1;border-radius:50%;background:#e5e7eb center/cover no-repeat}
    .ss-label{flex:1 1 auto;color:#0f172a;text-align:left}
    .ss-caret{opacity:.6}
    .ss-list{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 6px);max-height:260px;overflow:auto;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.08);display:none}
    .ss.open .ss-list{display:block}
    .ss-item{min-height:40px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer}
    .ss-item:hover{background:#f1f5f9}
    .ss-item.active{background:#eaf3ff}
    .visually-hidden-select{position:absolute!important;left:-9999px!important;width:1px;height:1px;opacity:0;pointer-events:none}
    #mainCatUI{margin-bottom:12px}


    .field{margin-bottom:14px}
    .field-label{font-weight:600;color:#0f172a;margin-bottom:6px;font-size:14px}
    .helptext{color:#64748b;font-size:12px;margin:6px 0 10px}

  
    .sub-strip-wrap{margin-bottom:12px}
    .sub-strip-head{display:flex;align-items:center;gap:8px;margin:0 0 8px}
    .sub-strip-title{font-weight:700;color:#0f172a}
    .sub-of-main{color:#64748b}
    .sub-strip{display:flex;gap:8px;flex-wrap:wrap}
    .pill{min-height:40px;display:inline-flex;align-items:center;gap:8px;border:1px solid #dbe3ef;background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;color:#0f172a;cursor:pointer}
    .pill:hover{background:#f1f5f9}
    .pill.active{background:#eaf3ff;border-color:#bfdbfe}
    .pill-icon{flex:0 0 32px;width:32px;height:32px;aspect-ratio:1/1;border-radius:50%;background:#e5e7eb center/cover no-repeat}


    .category-title{font-size:18px;font-weight:700;color:#0f172a;margin:0 0 12px}
  </style>
</head>

<body>

    <div class="header-left">

<a class="header-icon" href="https://line.me/R/ti/p/@876sqopb">💬</a>
<a class="header-icon" href="tel:0924742707">📞</a>

      <div class="sub-strip-wrap" id="subStripWrap2">
