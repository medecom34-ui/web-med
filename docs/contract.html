<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ติดต่อเรา | ภัทรอุปกรณ์การแพทย์</title>

  <!-- CSS ชุดเดียวกับ HOME -->
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/mobile.css" media="(max-width: 768px)">
  <link rel="stylesheet" href="./assets/css/contract.css" />
</head>
<body>

<!-- ===== TOPBAR (เหมือน HOME 100%) ===== -->
<div class="topbar">
  <div class="container topbar__inner" id="authBar"></div>
</div>

<!-- ===== HEADER (คัดจาก HOME ตรง ๆ) ===== -->
<header class="header container">

  <div class="header-left">
    <a class="logo" href="index.html">
      <div class="logo__box">HOME</div>
    </a>

    <!-- เปลี่ยนตรงนี้อย่างเดียว -->
    <a class="logo" href="contract.html">
      <div class="logo__box active">Contract Us</div>
    </a>
  </div>

  <div class="header-icons">
    <a class="header-icon" href="orders.html" title="สถานะคำสั่งซื้อ">
      <span class="icon-transport">🚚</span>
      <span id="statusBadge" class="badge">0</span>
    </a>
    <a id="cartButton" class="header-icon" role="button" title="ตะกร้า">
      🛒 <span id="cartCount" class="badge">0</span>
    </a>
  </div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main class="contact-page">

  <!-- Title ของหน้า (ไม่ใช่ header เว็บ) -->
  <section class="contact-header">
    <h1>Contract Us</h1>
    <div class="divider">
      <span>Contact Us</span>
    </div>
    <p class="desc">ติดต่อสอบถามข้อมูลหรือปรึกษาเราได้ที่</p>
  </section>

  <section class="contact-container">

    <div class="contact-card">
      <div class="icon outline company"></div>
      <h3>บริษัท</h3>
      <p class="value">PIMPATARA INTERTRADE COMPANY LIMITED</p>
    </div>

    <div class="contact-card clickable" onclick="openLine()">
      <div class="icon outline line"></div>
      <h3>LINE ID</h3>
      <small>กดเพื่อแอดไลน์</small>
    </div>

    <div class="contact-card">
      <div class="icon outline phone"></div>
      <h3>เบอร์โทร</h3>
      <p class="value">0924742707</p>
    </div>

  </section>
</main>

<div class="contact-wave"></div>

<!-- ===== JS ต้องมีเหมือน HOME ===== -->
<script src="./assets/js/cart.js"></script>
<script src="./assets/js/auth.js"></script>
<script src="./assets/js/contract.js"></script>

</body>
</html>
