<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ติดต่อเรา | ภัทรอุปกรณ์การแพทย์</title>

  <!-- ใช้ CSS ชุดเดียวกับเว็บ -->
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/mobile.css" media="(max-width: 768px)">
  <link rel="stylesheet" href="./assets/css/contract.css" />
</head>
<body>

<!-- ===== TOPBAR (เหมือนทุกหน้า) ===== -->
<div class="topbar">
  <div class="container topbar__inner" id="authBar"></div>
</div>

<!-- ===== HEADER (โครงเดียวกับ HOME) ===== -->
<header class="header container">

  <div class="header-left">
    <a class="logo" href="index.html">
      <div class="logo__box">HOME</div>
    </a>

    <!-- ใช้ logo__box + active เหมือน HOME -->
    <a class="logo" href="contract.html">
      <div class="logo__box active">ติดต่อเรา</div>
    </a>
  </div>

  <div class="header-icons">
    <a class="header-icon" href="orders.html" title="สถานะคำสั่งซื้อ">
      🚚 <span class="badge">0</span>
    </a>
    <a id="cartButton" class="header-icon" title="ตะกร้า">
      🛒 <span class="badge">0</span>
    </a>
  </div>

</header>

<!-- ===== MAIN ===== -->
<main class="contact-page">

  <!-- ===== PAGE TITLE (ไม่ใช่ header เว็บ) ===== -->
  <section class="contact-header">
    <h1>Contract Us</h1>
    <div class="divider">
      <span>Contact Us</span>
    </div>
    <p class="desc">ติดต่อสอบถามข้อมูลหรือปรึกษาเราได้ที่</p>
  </section>

  <!-- ===== CONTACT CARDS ===== -->
  <section class="contact-container">

    <div class="contact-card">
      <div class="icon green">🏥</div>
      <h3>ชื่อร้าน</h3>
      <p class="value">ภัทรอุปกรณ์การแพทย์</p>
    </div>

    <div class="contact-card clickable" onclick="openLine()">
      <div class="icon line">💬</div>
      <h3>LINE ID</h3>
      <p class="value line-text">@pattara.medical</p>
      <small>กดเพื่อแอดไลน์</small>
    </div>

    <div class="contact-card">
      <div class="icon blue">📞</div>
      <h3>เบอร์โทร</h3>
      <p class="value">
        081-234-5678<br />
        02-123-4567
      </p>
    </div>

  </section>
</main>

<div class="contact-wave"></div>

<script src="./assets/js/contract.js"></script>
</body>
</html>
