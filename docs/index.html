<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title> ภัทรอุปกรณ์การแพทย์ </title>
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/mobile.css" media="(max-width: 768px)">
<style>

  /* .container{max-width:1280px;margin:0 auto;} */


  .home-grid{
    max-width:1280px;
    margin:24px auto;
    padding:0 16px;
    display:grid;
    grid-template-columns:320px 1fr;
    gap:24px
  }
  @media (max-width:1024px){
    .home-grid{grid-template-columns:1fr}
  }

 
  .sidecard{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.06)
  }
  .sidecard__title{
    font-weight:800;
    font-size:18px;
    padding:16px 18px;
    border-bottom:1px solid #e5e7eb
  }
  .catlist{list-style:none;margin:0;padding:8px}
  .catitem{border-radius:12px}
  .cathead{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:12px;
    text-decoration:none;
    color:#1f2937
  }
  .cathead:hover{background:#f3f4f6}


  .ph{
  width:100px;
  height:100px;
  border-radius:8px;
  background-size:contain !important;
  background-position:center;
  background-repeat:no-repeat;
  background-color:#fff;
}

  .catname{flex:1 1 auto;font-weight:700}
  .caret{
    width:16px;
    height:16px;
    flex:0 0 auto;
    transform:rotate(-90deg);
    opacity:.55
  }
  .catitem.open .caret{transform:rotate(0)}

  .sub{display:none;padding:6px 0 10px 24px;list-style:none}
  .catitem.open > .sub{display:block}
  .sub .subrow{
    display:flex;align-items:center;gap:10px;
    padding:8px 4px;border-radius:8px;color:#1f2937;text-decoration:none
  }
  .sub .subrow:hover{background:#f8fafc}


  .subph{
  width:50px;
  height:40px;
  border-radius:6px;
  background-size:contain !important;
  background-position:center;
  background-repeat:no-repeat;
  background-color:#fff;
}
  .subname{line-height:1.25}

  .home-main section{margin-bottom:28px}


.cat__img{
  width:150px;
  height:150px;
  border-radius:10px;
  background-size:contain !important;
  background-position:center;
  background-repeat:no-repeat;
  background-color:#fff;
}
.cat {
  padding-top: 7px !important;
  padding-bottom: 7px !important;
}

</style>


</head>
<body>

  </div>

      <span class="search__icon">🔍</span>

</header>

<!-- MOBILE CATEGORY STRIP -->

    <aside class="sidecats">

    <div class="home-main">

<section class="category-grid-desktop section">
