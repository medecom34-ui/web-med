<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>รายละเอียดสินค้า | Med E-Commerce</title>
  <link rel="stylesheet" href="./assets/css/main.css" />
  <link rel="stylesheet" href="./assets/css/pdmobile.css" media="(max-width: 768px)">
</head>
<body>
 
<div class="topbar">
  <div class="container topbar__inner" id="authBar"></div>
</div>


<header class="header container">
  <a class="logo" href="index.html"><div class="logo__box">HOME</div></a>
    <!-- LINE -->
  <a class="header-icon header-line"
     href="https://line.me/R/ti/p/@876sqopb"
     target="_blank"
     title="ติดต่อทาง LINE">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path fill="#06C755"
        d="M19.2 3H4.8C3.26 3 2 4.26 2 5.8v7.4C2 14.74
           3.26 16 4.8 16h2.4v3l3.6-3h8.4
           c1.54 0 2.8-1.26 2.8-2.8V5.8
           C22 4.26 20.74 3 19.2 3z"/>
    </svg>
    <span>LINE</span>
  </a>

  <!-- PHONE -->
  <a class="header-icon header-phone"
     href="tel:0924742707"
     title="โทรศัพท์">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path fill="#2563eb"
        d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2
           a1 1 0 011.01-.24c1.12.37 2.33.57
           3.58.57a1 1 0 011 1v3.5
           a1 1 0 01-1 1C10.07 22 2 13.93 2 4
           a1 1 0 011-1h3.5a1 1 0 011 1
           c0 1.25.2 2.46.57 3.59
           a1 1 0 01-.25 1.01l-2.2 2.19z"/>
    </svg>
    <span>092-474-2707</span>
  </a>

  <!-- <div class="search">
    <input type="text" class="search__input" placeholder="ค้นหาสินค้า อุปกรณ์การแพทย์..." />
    <span class="search__icon">🔍</span>
  </div> -->


  <div class="header-icons">

    <a class="header-icon" href="orders.html" title="สถานะคำสั่งซื้อ">
      <span class="icon-transport">🚚</span>
      <span id="statusBadge" class="badge">0</span>
    </a>
   
    <a id="cartButton" class="header-icon" role="button" title="ตะกร้า">
      🛒 <span id="cartCount" class="badge">0</span>
    </a>
  </div>
</header>




<div class="breadcrumb">
  <div class="container breadcrumb__inner">
    <a href="javascript:history.back()" class="back-link">
      <span class="back-link__icon">ย้อนกลับ</span>
    </a>

    <span class="breadcrumb-text">
      หน้าหลัก > <b id="crumb-main"></b><span id="crumb-sub"></span>
    </span>
  </div>
</div>




  <main class="container product-layout">
  
    <div class="product-img">
      <div class="img-box">
        <img id="product-image" src="./assets/img/placeholder.png" alt="product image" />
      </div>

    
      <div id="product-thumbs" class="thumb-row"></div>
    </div>


 
    <div class="product-info">
      <div class="info-card">
        <h1 id="product-name" class="prod-title"></h1>

        <div class="prod-meta">
          <span class="label">รหัสสินค้า:</span>
          <span id="product-code"></span>
        </div>

        <div id="product-price" class="prod-price"></div>

        
        <div id="product-options" class="option-group"></div>

        <div class="buy-row">
          <div class="qty-group" aria-label="ปรับจำนวน">
            <button id="minus" type="button" aria-label="ลดจำนวน">−</button>
            <input id="qty" type="number" value="1" min="1" />
            <button id="plus" type="button" aria-label="เพิ่มจำนวน">+</button>
          </div>

          <button id="addCart" class="btn-primary">เพิ่มใส่ตะกร้า</button>
        </div>
      </div>
    </div>
  </main>

 
<section class="section bg-lightblue">
  <div class="container">
    <div class="product-desc-box">
      <h3 class="product-desc-title">รายละเอียดสินค้า</h3>
      <p id="product-desc" class="product-desc-text"></p>
    </div>
  </div>
</section>





  <footer class="footer">
    <div class="container">© <span id="year"></span> Med E-Commerce</div>
  </footer>

  <!-- Cart Drawer -->
<div id="cartOverlay" class="overlay hidden"></div>
<aside id="cartDrawer" class="cart-drawer hidden" aria-labelledby="cartTitle">
  <div class="cart-header">
    <h3 id="cartTitle">รถเข็นของฉัน</h3>
    <button id="cartClose" class="icon-btn" aria-label="ปิด">✕</button>
  </div>

  <div id="cartItems" class="cart-items"></div>

<div class="cart-footer">
  <div class="cart-total">
    รวมทั้งหมด: <b id="cartTotal">฿0.00</b>
  </div>
  <a id="goCheckout" class="btn-primary w-full" href="checkout.html">สั่งซื้อสินค้า</a>
</div>
    <!-- ปุ่มไปเช็คเอาท์ (อนาคต) -->
    <!-- <a class="btn-primary w-full" href="checkout.html">ชำระเงิน</a> -->
  </div>
</aside>

<!-- ใส่ cart.js ก่อนสคริปต์เฉพาะหน้าเสมอ -->
<script src="./assets/js/cart.js"></script>
<script src="./assets/js/auth.js"></script>

  <script type="module" src="./assets/js/product.js"></script>
</body>
</html>
